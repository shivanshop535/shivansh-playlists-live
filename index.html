<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shivansh Playlists | Live TV Web App</title>

  <!-- Favicon / Website Icon -->
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/q3gD2Cm9/6226284901146149931.jpg">

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- HLS.js Library for Live Streaming Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(22, 27, 46, 0.7);
      --primary: #00d2ff;
      --accent: #9254ff;
      --pink: #ff2a85;
      --text: #ffffff;
      --text-muted: #8e9bb0;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(146, 84, 255, 0.08) 0%, transparent 40%);
    }

    /* HEADER / NAVBAR */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      background: rgba(10, 11, 16, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
      border: 2px solid var(--primary);
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0088cc, var(--primary));
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
      transition: all 0.3s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
    }

    /* CONTROLS SECTION */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 20px 30px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 500px;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    .category-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .pill {
      padding: 8px 18px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .pill.active, .pill:hover {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(146, 84, 255, 0.3);
    }

    /* MAIN VIEWS */
    main {
      flex: 1;
      padding: 10px 30px 40px;
    }

    /* GRID VIEW */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .channel-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0, 210, 255, 0.2);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 42, 133, 0.8);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .channel-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .channel-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .channel-group {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* PLAYER VIEW */
    .player-container {
      display: none;
      flex-direction: column;
      max-width: 1000px;
      margin: 0 auto;
      gap: 20px;
    }

    .back-btn {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--glass-border);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-details {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .player-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    /* TELEGRAM POPUP MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(145deg, rgba(22, 27, 46, 0.95), rgba(10, 11, 16, 0.95));
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 210, 255, 0.2);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 15px;
      border: 3px solid var(--primary);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .modal-join-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0088cc, var(--primary));
      color: #fff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
      transition: all 0.3s ease;
    }

    .modal-join-btn:hover {
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.7);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="logo-container" onclick="showGridView()">
      <img src="https://i.ibb.co/q3gD2Cm9/6226284901146149931.jpg" alt="Logo" class="logo-img">
      <span class="logo-text">Shivansh Playlists</span>
    </div>
    <a href="https://t.me/ShivanshPlaylists" target="_blank" class="telegram-btn">
      <i class="fa-brands fa-telegram"></i> Join Telegram
    </a>
  </header>

  <!-- CONTROLS -->
  <div class="controls-bar" id="controlsBar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" class="search-input" id="searchInput" placeholder="Search Live Channels..." oninput="filterChannels()">
    </div>
    <div class="category-pills" id="categoryPills">
      <div class="pill active" onclick="filterCategory('All', this)">All</div>
      <div class="pill" onclick="filterCategory('Sports', this)">Sports</div>
      <div class="pill" onclick="filterCategory('News', this)">News</div>
      <div class="pill" onclick="filterCategory('Entertainment', this)">Entertainment</div>
      <div class="pill" onclick="filterCategory('Movies', this)">Movies</div>
      <div class="pill" onclick="filterCategory('Music', this)">Music</div>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main>
    <!-- CHANNELS GRID -->
    <div class="channels-grid" id="channelsGrid"></div>

    <!-- PLAYER VIEW -->
    <div class="player-container" id="playerContainer">
      <button class="back-btn" onclick="showGridView()">
        <i class="fa-solid fa-arrow-left"></i> Back to Channels
      </button>
      <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay></video>
      </div>
      <div class="player-details">
        <div class="player-info">
          <img id="playerLogo" src="" class="player-logo" alt="">
          <div>
            <h2 id="playerTitle" style="font-size: 1.3rem;">Channel Name</h2>
            <p id="playerCategory" style="color: var(--text-muted); font-size: 0.85rem;">Live Stream</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- TELEGRAM POPUP MODAL -->
  <div class="modal-overlay" id="telegramModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      <img src="https://i.ibb.co/q3gD2Cm9/6226284901146149931.jpg" alt="Shivansh Logo" class="modal-icon">
      <h3 class="modal-title">Join Shivansh Playlists</h3>
      <p class="modal-desc">Get access to live TV streams, updates, exclusive audio edits, and playlist links!</p>
      <a href="https://t.me/ShivanshPlaylists" target="_blank" class="modal-join-btn" onclick="closeModal()">
        <i class="fa-brands fa-telegram"></i> Join Channel Now
      </a>
    </div>
  </div>

  <script>
    // Live TV Channel Database
    const channels = [
      {
        id: "star-sports-1",
        name: "Star Sports 1",
        category: "Sports",
        logo: "https://upload.wikimedia.org/wikipedia/commons/2/23/Star_Sports_1_HD.png",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "aaj-tak",
        name: "Aaj Tak",
        category: "News",
        logo: "https://upload.wikimedia.org/wikipedia/commons/3/30/Aaj_Tak_logo.png",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "sony-sab",
        name: "Sony SAB",
        category: "Entertainment",
        logo: "https://upload.wikimedia.org/wikipedia/commons/8/8e/Sony_SAB_logo.png",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "star-plus",
        name: "Star Plus",
        category: "Entertainment",
        logo: "https://upload.wikimedia.org/wikipedia/commons/e/e0/Star_Plus_logo.png",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "star-movies",
        name: "Star Movies",
        category: "Movies",
        logo: "https://upload.wikimedia.org/wikipedia/commons/4/46/Star_Movies_logo.png",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: "mtv-india",
        name: "MTV India",
        category: "Music",
        logo: "https://upload.wikimedia.org/wikipedia/commons/6/6f/MTV_Logo.svg",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      }
    ];

    let currentCategory = "All";
    let hlsInstance = null;

    // DOM Elements
    const channelsGrid = document.getElementById('channelsGrid');
    const playerContainer = document.getElementById('playerContainer');
    const controlsBar = document.getElementById('controlsBar');
    const videoPlayer = document.getElementById('videoPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const playerCategory = document.getElementById('playerCategory');
    const playerLogo = document.getElementById('playerLogo');
    const telegramModal = document.getElementById('telegramModal');

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      renderChannels();
      checkRoute();
      showModal();
    });

    // Handle standard browser navigation (Back/Forward)
    window.addEventListener('popstate', () => {
      checkRoute();
    });

    function showModal() {
      setTimeout(() => {
        telegramModal.classList.add('active');
      }, 1000);
    }

    function closeModal() {
      telegramModal.classList.remove('active');
    }

    function renderChannels() {
      channelsGrid.innerHTML = "";
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = channels.filter(ch => {
        const matchesCategory = currentCategory === "All" || ch.category === currentCategory;
        const matchesSearch = ch.name.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      filtered.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => openChannel(ch.id);
        card.innerHTML = `
          <span class="card-badge">LIVE</span>
          <img src="${ch.logo}" class="channel-logo" alt="${ch.name}" onerror="this.src='https://i.ibb.co/q3gD2Cm9/6226284901146149931.jpg'">
          <div class="channel-name">${ch.name}</div>
          <div class="channel-group">${ch.category}</div>
        `;
        channelsGrid.appendChild(card);
      });
    }

    function filterCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.pill').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      renderChannels();
    }

    function filterChannels() {
      renderChannels();
    }

    function openChannel(id) {
      history.pushState({ id: id }, '', `/id?${id}`);
      loadPlayer(id);
    }

    function checkRoute() {
      const search = window.location.search;
      if (search.startsWith('?')) {
        const channelId = search.substring(1);
        if (channels.some(c => c.id === channelId)) {
          loadPlayer(channelId);
          return;
        }
      }
      showGridView();
    }

    function loadPlayer(id) {
      const channel = channels.find(c => c.id === id);
      if (!channel) return;

      channelsGrid.style.display = 'none';
      controlsBar.style.display = 'none';
      playerContainer.style.display = 'flex';

      playerTitle.textContent = channel.name;
      playerCategory.textContent = channel.category + " • Live Stream";
      playerLogo.src = channel.logo;

      // HLS Playback Integration
      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        hlsInstance = new Hls();
        hlsInstance.loadSource(channel.streamUrl);
        hlsInstance.attachMedia(videoPlayer);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoPlayer.play();
        });
      } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
        videoPlayer.src = channel.streamUrl;
        videoPlayer.play();
      }
    }

    function showGridView() {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      videoPlayer.pause();
      videoPlayer.src = "";

      playerContainer.style.display = 'none';
      channelsGrid.style.display = 'grid';
      controlsBar.style.display = 'flex';

      if (window.location.search) {
        history.pushState({}, '', window.location.pathname);
      }
    }
  </script>
</body>
</html>
